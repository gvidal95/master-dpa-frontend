<form class="employee-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <h2 class="employee-form__title">{{ isEditMode ? 'Editar empleado' : 'Nuevo empleado' }}</h2>

  <div class="employee-form__field">
    <label for="nombre">Nombre</label>
    <input
      id="nombre"
      type="text"
      formControlName="nombre"
      autocomplete="off"
      [attr.aria-invalid]="!!errorFor('nombre')"
      [attr.aria-describedby]="errorFor('nombre') ? 'nombre-error' : null"
    />
    <p class="employee-form__error" id="nombre-error" *ngIf="errorFor('nombre') as message">{{ message }}</p>
  </div>

  <div class="employee-form__field">
    <label for="cargo">Cargo</label>
    <input
      id="cargo"
      type="text"
      formControlName="cargo"
      autocomplete="off"
      [attr.aria-invalid]="!!errorFor('cargo')"
      [attr.aria-describedby]="errorFor('cargo') ? 'cargo-error' : null"
    />
    <p class="employee-form__error" id="cargo-error" *ngIf="errorFor('cargo') as message">{{ message }}</p>
  </div>

  <div class="employee-form__field">
    <label for="departamento">Departamento</label>
    <input
      id="departamento"
      type="text"
      formControlName="departamento"
      autocomplete="off"
      [attr.aria-invalid]="!!errorFor('departamento')"
      [attr.aria-describedby]="errorFor('departamento') ? 'departamento-error' : null"
    />
    <p class="employee-form__error" id="departamento-error" *ngIf="errorFor('departamento') as message">
      {{ message }}
    </p>
  </div>

  <div class="employee-form__field">
    <label for="sueldo">Sueldo</label>
    <input
      id="sueldo"
      type="number"
      step="0.01"
      min="0.01"
      formControlName="sueldo"
      autocomplete="off"
      [attr.aria-invalid]="!!errorFor('sueldo')"
      [attr.aria-describedby]="errorFor('sueldo') ? 'sueldo-error' : null"
    />
    <p class="employee-form__error" id="sueldo-error" *ngIf="errorFor('sueldo') as message">{{ message }}</p>
  </div>

  <div class="employee-form__actions">
    <button type="submit" class="button button--primary" [disabled]="saving">
      {{ saving ? 'Guardando…' : isEditMode ? 'Guardar cambios' : 'Agregar empleado' }}
    </button>
    <button
      type="button"
      class="button button--ghost"
      *ngIf="isEditMode"
      [disabled]="saving"
      (click)="onCancel()"
    >
      Cancelar
    </button>
  </div>
</form>
